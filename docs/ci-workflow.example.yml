name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build -buildvcs=false -o bin/laraserve${{ runner.os == 'Windows' && '.exe' || '' }} .
      - uses: actions/upload-artifact@v4
        with:
          name: laraserve-${{ matrix.os }}-amd64
          path: bin/laraserve*
  windows-integration:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Native Windows Laravel workflow
        run: go test ./integration -v -timeout 20m
        env:
          LARASERVE_TEST_WINDOWS: '1'
