; php.ini used by laraserve. The host's php.ini is never read (PHPRC points here).
memory_limit = 512M
max_execution_time = 60
upload_max_filesize = 64M
post_max_size = 64M
date.timezone = UTC
display_errors = Off
log_errors = On
error_reporting = E_ALL
variables_order = "EGPCS"
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
